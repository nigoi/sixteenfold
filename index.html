<!doctype html>

<html>
  <head>
    <title>fifteenfold</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

  <body>
    <div id="error" hidden>
      <span>Error Loading page.</span>
      <button id="retry">Retry</button>
    </div>
    <div id="mainContainer" hidden>
      <div id="gridContainer">
        <h1>sixteenfold</h1>
        <div id="letterPool">
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
          <div class="tile">
            <span class="letter">A</span><span class="score">1</span>
          </div>
        </div>
      </div>

      <div id="wordsBox">
        <div class="wordLineContainer">
          <button class="activeWord">*</button>
          <div class="wordLine"></div>
        </div>
      </div>

      <div class="playerScore">
        <span id="score">0</span>
        <button id="submit">SUBMIT</button>
      </div>
    </div>

    <div id="results" hidden>
      <h1>results</h1>
      <div id="resultsBox"></div>
      <div id="scoreBox">
        <span id="totalScore">0</span>
        <span>total</span>
      </div>
      
      </div>

    </div>

    <script type="module" src="./src/main.js"></script>

</html>

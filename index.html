<!DOCTYPE html>

<html>
    <head>
        <title>fifteenfold</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=emergency" />
        
    </head>

    <body>
        <div id="mainContainer">

            <div id="gridContainer">
                <h1>fifteenfold</h1>
                <div id="letter-pool">
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                    <div class="tile"><span class="letter">A</span><span class="score">1</span></div>
                </div>
            </div>

            <div id="wordsBox">
                <div class="wordLineContainer">
                    <button class="activeWord" aria-label="Select word">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="24" height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 6v12"/>
                        <path d="m17.196 9-10.392 6"/>
                        <path d="m17.196 15-10.392-6"/>
                    </svg>
                </button>
                    <div class="wordLine"></div>
                </div>
            </div>
            <button class="addWord">+</button>

        </div>
        
        <script src="script.js"></script>
    </body>
</html>
